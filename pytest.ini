[pytest]

python_files    = test_*.py
python_classes  = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers
    --alluredir=reports/allure-results
    --html=reports/html/report.html
    --self-contained-html
    --reruns 0
    --reruns-delay 0

filterwarnings =
    ignore::DeprecationWarning:appium.*
    ignore::DeprecationWarning:selenium.*
# NOTE: no urllib3.exceptions.NotOpenSSLWarning filter here.
# requirements.txt deliberately pins urllib3<2.0.0 so this
# warning can never fire in the first place — and that class
# only EXISTS in urllib3 2.x. With urllib3 1.x correctly
# installed (as pinned), pytest crashes on startup trying to
# resolve a filter for a class that doesn't exist in this
# version. Do not re-add this line unless you also upgrade
# urllib3 to 2.x (which reintroduces the LibreSSL warning on
# macOS that pinning below 2.0 was meant to avoid).

log_cli             = true
log_cli_level       = INFO
log_cli_format      = %(asctime)s [%(levelname)-8s] %(filename)s:%(lineno)d — %(message)s
log_cli_date_format = %H:%M:%S

# ── Markers ───────────────────────────────────────────────
# Run examples:
#   ./run_tests.sh emulator qa smoke          → 4 tests  (~5 min)
#   ./run_tests.sh emulator qa regression     → 26 tests (~45 min)
#   ./run_tests.sh emulator qa feed           → 19 tests (~35 min)
#   ./run_tests.sh emulator qa login          → 8 tests  (~15 min)
#   ./run_tests.sh emulator qa feed_e2e       → 1 test   (~20 min)
#
# Test inventory (26 total):
#   login  : 8  (1 smoke + 7 regression)
#   feed   : 19 (4 smoke + 15 regression + parametrized variants)
#   feed_e2e: 1 (continuous 10-reel flow)
markers =
    smoke:      Fast gate — run after every build (~4 tests)
    sanity:     Alias for smoke — reserved for future use
    regression: Full regression suite — all features
    login:      Authentication and session management tests
    feed:       All feed/reel tests (individual actions + E2E)
    feed_e2e:   Long-running E2E continuous feed flow only
    requires_logout: Forces an automatic app-data clear (adb pm clear)
        before this test's driver session, guaranteeing a logged-out
        app state for that one test regardless of the global NO_RESET
        setting. Use ONLY for tests that genuinely require a logged-out
        start (e.g. invalid/short OTP) — every other test keeps the
        fast noReset path untouched.